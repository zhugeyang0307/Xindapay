<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 60" width="360" height="60">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#1677ff"/>
      <stop offset="100%" stop-color="#0d5cd6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#40a9ff"/>
      <stop offset="100%" stop-color="#1677ff"/>
    </linearGradient>
  </defs>

  <!-- 左侧图标：几何抽象 · 支付符号 -->
  <g transform="translate(0,6)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#brandGrad)"/>
    <!-- ¥ 符号 -->
    <path d="M14 14 L24 26 L34 14" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 26 L24 38" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <path d="M17 30 L31 30" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <path d="M17 35 L31 35" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 主标题：信达支付系统 -->
  <text x="64" y="30"
        font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif"
        font-size="24" font-weight="700" fill="url(#brandGrad)"
        dominant-baseline="middle" letter-spacing="1">信达支付系统</text>

  <!-- 副标题：湖北云泽信达网络科技有限公司 -->
  <text x="65" y="50"
        font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif"
        font-size="10" fill="#8a94a6" letter-spacing="0.5">湖北云泽信达网络科技有限公司</text>
</svg>
